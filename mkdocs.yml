site_name: GoNZB Documentation
site_description: Setup and operation documentation for GoNZB
site_url: https://datallboy.github.io/GoNZB/
repo_url: https://github.com/datallboy/GoNZB
repo_name: datallboy/GoNZB
edit_uri: edit/dev/docs/

docs_dir: docs
site_dir: site
strict: true
exclude_docs: |
  archive/
  ARCHITECTURE.md
  wiki/indexer/
  wiki/gonzbnet/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Use light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started:
      - Overview: getting-started/index.md
      - Install with Docker: getting-started/docker.md
      - First-run setup: getting-started/first-run.md
      - Deployment recommendations: getting-started/deployment.md
      - Upgrades and backups: getting-started/upgrades.md
      - Troubleshooting: getting-started/troubleshooting.md
  - Integrations: wiki/integrations/README.md
  - Usenet indexer: modules/indexer.md
  - GoNZBNet:
      - Overview and roles: modules/gonzbnet.md
      - Private pool quickstart: modules/private-pool.md
      - Networking and exposure: modules/networking.md
