name: Test

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  go-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.10
        env:
          POSTGRES_DB: gonzb_ci_test
          POSTGRES_USER: gonzb_test
          POSTGRES_PASSWORD: gonzb_test
          POSTGRES_INITDB_ARGS: --data-checksums
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gonzb_test -d gonzb_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      CI: "true"
      GONZB_REQUIRE_TEST_PG: "1"
      GONZB_TEST_PG_DSN: postgres://gonzb_test:gonzb_test@127.0.0.1:5432/gonzb_ci_test?sslmode=disable
      GONZB_QUERY_SOAK: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm --prefix ui ci

      - name: Lint UI
        run: npm --prefix ui run lint

      - name: Build UI assets
        run: npm --prefix ui run build

      - name: Audit production UI dependencies
        # The remaining React Router v6 advisories affect server rendering,
        # which this browser-only SPA does not use. Dynamic login redirects are
        # also constrained to local absolute paths. Block every high finding.
        run: npm --prefix ui audit --audit-level=high

      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg p7zip-full
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Run Go tests
        run: ./scripts/test_ci.sh

      - name: Run Go vet
        run: go vet ./...

      - name: Run static analysis
        run: staticcheck ./...

      - name: Check reachable Go vulnerabilities
        run: govulncheck ./...

  gonzbnet-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Build embedded UI assets
        run: |
          npm --prefix ui ci
          npm --prefix ui run build

      - name: Install fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq curl

      - name: Run four-node GoNZBNet E2E
        env:
          GONZBNET_E2E_KEEP_STATE_ON_FAILURE: "1"
        run: ./scripts/gonzbnet_e2e.sh test

      - name: Show fixture logs after failure
        if: failure()
        run: |
          for log in .e2e/gonzbnet/node-*/stdout.log; do
            if [ -f "$log" ]; then
              echo "::group::$log"
              tail -n 200 "$log"
              echo "::endgroup::"
            fi
          done
