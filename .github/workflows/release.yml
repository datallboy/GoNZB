name: Build and Release

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write
    packages: write

jobs:
    build-and-publish:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                fetch-depth: 0

            - name: Validate release tag
              shell: bash
              run: |
                if [[ ! "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
                  echo "release tag must be semantic, for example v0.10.0 or v0.10.0-rc.1" >&2
                  exit 1
                fi
                git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
                git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main || {
                  echo "release tags must point to a commit on main" >&2
                  exit 1
                }

            - name: Lowercase repo name
              run: | 
                echo "REPO_LOWER=${GITHUB_REPOSITORY@L}" >> "${GITHUB_ENV}"
            
            - name: Set up Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                go-version: '1.25.12'

            - name: Set up Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                node-version: "22"
                cache: "npm"
                cache-dependency-path: ui/package-lock.json

            - name: Install UI dependencies
              run: npm --prefix ui ci

            - name: Audit UI dependencies
              run: npm --prefix ui audit --audit-level=high

            - name: Prepare build metadata
              shell: bash
              run: |
                if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
                  version="${GITHUB_REF_NAME}"
                else
                  version="$(git describe --tags --always --dirty)"
                fi
                echo "RELEASE_VERSION=${version}" >> "${GITHUB_ENV}"
                echo "RELEASE_BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "${GITHUB_ENV}"

            # 1. Build binaries via Makefile
            - name: Build Binaries
              run: make build-release VERSION="${RELEASE_VERSION}" BUILD_TIME="${RELEASE_BUILD_TIME}"

            # 2. Generate Checksums
            - name: Generate Checksums
              run: |
                cd bin
                sha256sum * > checksums.txt
                cat checksums.txt

            # 2. Setup Docker Buildx (for multi-platform support)
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

            # 3. Login to Github Container Registry (GHCR)
            - name: Login to GHCR
              if: startsWith(github.ref, 'refs/tags/')
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{secrets.GITHUB_TOKEN }}

            # 4. Build and Push Docker Image
            - name: Build and Push Docker
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
              with:
                context: .
                push: ${{ startsWith(github.ref, 'refs/tags/') }}
                tags: |
                  ghcr.io/${{ env.REPO_LOWER }}:latest
                  ghcr.io/${{ env.REPO_LOWER }}:${{ env.RELEASE_VERSION }}
                build-args: |
                  VERSION=${{ env.RELEASE_VERSION }}
                  BUILD_TIME=${{ env.RELEASE_BUILD_TIME }}

            # 5. Create GitHub Release and Upload Binary
            - name: Release
              uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
              if: startsWith(github.ref, 'refs/tags/')
              with:
                files: |
                  bin/gonzb_*
                  bin/gonzb-worker_*
                  bin/gonzb-worker-config.yaml.example
                  bin/gonzb-worker.service
                  bin/checksums.txt
                generate_release_notes: true
