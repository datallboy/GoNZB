# TEST FIXTURE ONLY. Loopback endpoints, disposable credentials, and .e2e state.
port: "18081"
bind_address: "127.0.0.1"
servers:
  - id: "e2e-indexer-fixture"
    host: "127.0.0.1"
    port: 11119
    tls: false
    max_connections: 2
    priority: 1
    roles: ["scrape"]
modules:
  aggregator: { enabled: true }
  usenet_indexer: { enabled: true }
  gonzbnet: { enabled: true }
  web_ui: { enabled: true }
  api: { enabled: true }
api:
  cors_allowed_origins: ["http://127.0.0.1:18081"]
aggregator:
  sources:
    usenet_indexer: { enabled: true }
    gonzbnet: { enabled: true }
indexing:
  newsgroups: ["alt.binaries.test"]
  storage_guard: { enabled: false }
  memory_guard: { enabled: false }
  scrape_latest: { enabled: true, interval_minutes: 1, batch_size: 100 }
  assemble: { enabled: true, interval_minutes: 1, batch_size: 100 }
  release_summary_refresh: { enabled: true, interval_minutes: 1, batch_size: 100 }
  release:
    enabled: true
    interval_minutes: 1
    batch_size: 100
    public_require_inspection: false
    public_require_enrichment: false
    public_require_clear_title: true
    public_require_payload_complete: true
  release_generate_nzb: { enabled: true, interval_minutes: 1, batch_size: 100 }
  release_archive_nzb: { enabled: true, interval_minutes: 1, batch_size: 100 }
gonzbnet:
  mode: integrated
  node_alias: "e2e-scanner-a"
  advertise_url: "https://localhost:18481/gonzbnet/v1"
  keys_dir: ".e2e/gonzbnet/node-a/keys"
  http_enabled: true
  allow_insecure_peer_http: false
  private_network: true
  network_id: "gonzbnet-e2e"
  local_pool_id: "pool.e2e"
  manual_peers:
    - "https://localhost:18482"
    - "https://localhost:18483"
  consumer_enabled: true
  scanner_enabled: true
  index_projection_enabled: true
  manifest_builder_enabled: true
  manifest_cache_enabled: true
  validator_enabled: false
  health_checker_enabled: false
  coverage_enabled: true
  scheduler_enabled: true
  publish_release_cards_enabled: true
  publish_release_cards_interval_minutes: 1
  manifest_availability_enabled: true
  pull_sync_enabled: true
  pull_sync_interval_minutes: 1
  push_sync_enabled: true
  push_sync_interval_minutes: 1
  websocket_gossip_enabled: false
  relay_enabled: false
  live_query_enabled: false
  send_user_context: false
log: { path: ".e2e/gonzbnet/node-a/gonzb.log", level: "debug", include_stdout: true }
store:
  sqlite_path: ".e2e/gonzbnet/node-a/gonzb.db"
  blob_dir: ".e2e/gonzbnet/node-a/blobs"
  payload_cache_enabled: true
  search_persistence_enabled: true
  pg_dsn: "postgres://gonzb:gonzb@127.0.0.1:55432/gonzbnet_a?sslmode=disable"
